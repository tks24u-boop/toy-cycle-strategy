<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メルカリ商品登録フォーム</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "游ゴシック体", "Yu Gothic", YuGothic, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }

    label .required {
      color: #e32f2f;
      margin-left: 4px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    small {
      display: block;
      margin-top: 6px;
      color: #999;
      font-size: 12px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    #output {
      margin-top: 40px;
      padding: 30px;
      background: #f5f5f5;
      border-radius: 12px;
      display: none;
    }

    #output h2 {
      font-size: 20px;
      color: #333;
      margin-bottom: 12px;
    }

    #output p {
      color: #666;
      margin-bottom: 16px;
      font-size: 14px;
    }

    pre {
      background: white;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.6;
      border: 2px solid #e0e0e0;
      max-height: 400px;
      overflow-y: auto;
    }

    .btn-copy {
      background: #4CAF50;
      padding: 10px 24px;
      width: auto;
      margin-top: 12px;
      font-size: 14px;
    }

    .btn-copy:hover {
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
    }

    .alert {
      padding: 12px 16px;
      background: #e8f5e9;
      border-left: 4px solid #4CAF50;
      border-radius: 4px;
      color: #2e7d32;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 24px;
      }

      .grid-2 {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛍️ メルカリ商品登録フォーム</h1>
    <p class="subtitle">商品情報を入力してJSONコードを生成します</p>

    <div id="copyAlert" class="alert">
      ✅ JSONコードをクリップボードにコピーしました！
    </div>

    <form id="mercariForm">
      <div class="form-group">
        <label>商品ID<span class="required">*</span></label>
        <input type="text" id="itemId" placeholder="例: 001" required>
        <small>3桁の数字（例：001, 002, 003）</small>
      </div>

      <div class="form-group">
        <label>商品名<span class="required">*</span></label>
        <input type="text" id="itemName" placeholder="例: アンパンマン おもちゃセット" required>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>価格（円）<span class="required">*</span></label>
          <input type="number" id="itemPrice" placeholder="1500" min="1" required>
        </div>

        <div class="form-group">
          <label>カテゴリ</label>
          <input type="text" id="itemCategory" placeholder="おもちゃ" value="おもちゃ">
        </div>
      </div>

      <div class="form-group">
        <label>商品説明<span class="required">*</span></label>
        <textarea id="itemDesc" placeholder="例: ほぼ未使用、美品です。2歳前後のお子様におすすめ。" required></textarea>
        <small>商品の状態や対象年齢などを記載してください</small>
      </div>

      <div class="form-group">
        <label>メルカリURL<span class="required">*</span></label>
        <input type="url" id="itemUrl" placeholder="https://jp.mercari.com/item/m..." required>
        <small>メルカリの商品ページURLを貼り付けてください</small>
      </div>

      <div class="form-group">
        <label>画像ファイル名<span class="required">*</span></label>
        <input type="text" id="itemImage" placeholder="item001.jpg" required>
        <small>⚠️ 必ず自分で撮影した写真を使用してください。画像は public/images/mercari/ フォルダに保存してください</small>
      </div>

      <button type="button" class="btn" onclick="generateJSON()">
        📋 JSONコード生成
      </button>
    </form>

    <div id="output">
      <h2>生成されたJSONコード</h2>
      <p>以下をコピーして <code>data/mercari-items.json</code> の <code>items</code> 配列に追加してください</p>
      <pre id="jsonOutput"></pre>
      <button class="btn btn-copy" onclick="copyToClipboard()">
        📋 コピー
      </button>
    </div>
  </div>

  <script>
    function generateJSON() {
      // フォームのバリデーション
      const form = document.getElementById('mercariForm');
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      // データ収集
      const data = {
        id: document.getElementById('itemId').value.padStart(3, '0'),
        name: document.getElementById('itemName').value,
        price: parseInt(document.getElementById('itemPrice').value),
        image: `images/mercari/${document.getElementById('itemImage').value}`,
        description: document.getElementById('itemDesc').value,
        url: document.getElementById('itemUrl').value,
        status: "active",
        category: document.getElementById('itemCategory').value,
        addedDate: new Date().toISOString().split('T')[0],
        soldDate: null
      };

      // JSON生成
      const jsonString = JSON.stringify(data, null, 2);
      document.getElementById('jsonOutput').textContent = jsonString;
      document.getElementById('output').style.display = 'block';

      // 出力エリアまでスクロール
      document.getElementById('output').scrollIntoView({ behavior: 'smooth' });
    }

    function copyToClipboard() {
      const text = document.getElementById('jsonOutput').textContent;
      navigator.clipboard.writeText(text).then(() => {
        // アラート表示
        const alert = document.getElementById('copyAlert');
        alert.style.display = 'block';

        // 3秒後に非表示
        setTimeout(() => {
          alert.style.display = 'none';
        }, 3000);

        // トップまでスクロール
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }).catch(err => {
        alert('コピーに失敗しました: ' + err);
      });
    }

    // Enterキーでのフォーム送信を防止
    document.getElementById('mercariForm').addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
