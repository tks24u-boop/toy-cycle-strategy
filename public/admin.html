<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理画面 | トイ・サイクル戦略室</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'navy': {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            200: '#bcccdc',
                            300: '#9fb3c8',
                            400: '#829ab1',
                            500: '#627d98',
                            600: '#486581',
                            700: '#334e68',
                            800: '#243b53',
                            900: '#102a43',
                        },
                        'accent': {
                            50: '#fff8f0',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            300: '#fdba74',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            800: '#9a3412',
                            900: '#7c2d12',
                        }
                    },
                    fontFamily: {
                        'sans': ['"Noto Sans JP"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            line-height: 1.8;
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            box-shadow: 0 4px 12px rgba(16, 42, 67, 0.1);
        }
        
        .img-placeholder {
            background: linear-gradient(135deg, #bcccdc 0%, #9fb3c8 100%);
        }
        
        /* トースト通知 */
        .toast {
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* ローディング */
        .btn-loading {
            position: relative;
            color: transparent !important;
        }
        .btn-loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ログイン画面のフェードイン */
        .fade-in {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-navy-50 text-navy-900 min-h-screen">
    
    <!-- ログイン画面 -->
    <div id="loginScreen" class="fixed inset-0 bg-navy-900 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl p-8 max-w-md w-full mx-4 fade-in">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-navy-800 rounded-xl flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-lock text-accent-400 text-2xl"></i>
                </div>
                <h1 class="text-xl font-bold text-navy-800">管理画面ログイン</h1>
                <p class="text-navy-500 text-sm mt-2">トイ・サイクル戦略室</p>
            </div>
            
            <form id="loginForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-navy-700 mb-2">
                        管理者パスワード
                    </label>
                    <input type="password" id="loginPassword" 
                           placeholder="パスワードを入力"
                           class="w-full border border-navy-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-accent-500 focus:border-transparent"
                           required autofocus>
                </div>
                <div id="loginError" class="hidden text-red-500 text-sm mb-4">
                    <i class="fas fa-exclamation-circle mr-1"></i>
                    <span></span>
                </div>
                <button type="submit" id="loginBtn"
                        class="w-full bg-accent-500 hover:bg-accent-600 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                    <i class="fas fa-sign-in-alt mr-2"></i>ログイン
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <a href="/" class="text-navy-500 hover:text-accent-500 text-sm transition-colors">
                    <i class="fas fa-arrow-left mr-1"></i>サイトに戻る
                </a>
            </div>
        </div>
    </div>
    
    <!-- 管理画面本体 -->
    <div id="adminContent" class="hidden">
        <!-- ヘッダー -->
        <header class="bg-navy-800 text-white py-4 shadow-lg">
            <div class="max-w-6xl mx-auto px-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-navy-700 rounded-lg flex items-center justify-center">
                        <i class="fas fa-cog text-accent-400 text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg">管理画面</h1>
                        <p class="text-navy-300 text-xs">トイ・サイクル戦略室</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/" class="text-navy-300 hover:text-white transition-colors text-sm">
                        <i class="fas fa-external-link-alt mr-1"></i>サイトを見る
                    </a>
                    <button id="logoutBtn" class="text-navy-300 hover:text-white transition-colors text-sm">
                        <i class="fas fa-sign-out-alt mr-1"></i>ログアウト
                    </button>
                </div>
            </div>
        </header>
        
        <main class="max-w-6xl mx-auto px-4 py-8">
            
            <!-- 記事追加フォーム -->
            <section class="bg-white rounded-xl shadow-sm p-6 mb-8">
                <h2 class="text-lg font-bold text-navy-800 mb-6 flex items-center">
                    <i class="fas fa-plus-circle text-accent-500 mr-2"></i>
                    新しい記事を追加
                </h2>
                
                <form id="addArticleForm" class="space-y-6">
                    <!-- URL入力 -->
                    <div>
                        <label class="block text-sm font-medium text-navy-700 mb-2">
                            記事URL <span class="text-red-500">*</span>
                        </label>
                        <div class="flex gap-3">
                            <input type="url" id="articleUrl" 
                                   placeholder="https://note.com/..." 
                                   class="flex-1 border border-navy-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-accent-500 focus:border-transparent"
                                   required>
                            <button type="button" id="fetchOgpBtn" 
                                    class="bg-navy-700 hover:bg-navy-800 text-white font-medium px-6 py-3 rounded-lg transition-colors whitespace-nowrap">
                                <i class="fas fa-magic mr-2"></i>情報を取得
                            </button>
                        </div>
                        <p class="text-xs text-navy-400 mt-2">
                            <i class="fas fa-info-circle mr-1"></i>
                            note、X (Twitter)、ブログ等のURLを入力してください
                        </p>
                    </div>
                    
                    <!-- プレビューエリア -->
                    <div id="previewArea" class="hidden">
                        <div class="border border-navy-200 rounded-lg p-4 bg-navy-50">
                            <h3 class="text-sm font-medium text-navy-600 mb-3">
                                <i class="fas fa-eye mr-1"></i>プレビュー
                            </h3>
                            
                            <div class="flex gap-4">
                                <!-- サムネイル -->
                                <div id="previewImage" class="flex-shrink-0 w-32 h-24 img-placeholder rounded-lg flex items-center justify-center overflow-hidden">
                                    <i class="fas fa-image text-2xl text-navy-400"></i>
                                </div>
                                
                                <!-- 情報 -->
                                <div class="flex-1 min-w-0">
                                    <input type="text" id="articleTitle" 
                                           placeholder="記事タイトル"
                                           class="w-full border border-navy-200 rounded px-3 py-2 text-sm font-medium mb-2 focus:outline-none focus:ring-2 focus:ring-accent-500"
                                           required>
                                    <textarea id="articleDescription" 
                                              placeholder="記事の説明"
                                              rows="2"
                                              class="w-full border border-navy-200 rounded px-3 py-2 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-accent-500"></textarea>
                                </div>
                            </div>
                            
                            <!-- 隠しフィールド -->
                            <input type="hidden" id="articleImage">
                            <input type="hidden" id="articleSource">
                        </div>
                    </div>
                    
                    <!-- カテゴリ選択 -->
                    <div id="categorySection" class="hidden">
                        <label class="block text-sm font-medium text-navy-700 mb-3">
                            カテゴリ <span class="text-red-500">*</span>
                        </label>
                        <div class="flex gap-3">
                            <label class="flex-1 cursor-pointer">
                                <input type="radio" name="category" value="探す" class="sr-only peer" required>
                                <div class="border-2 border-navy-200 rounded-lg p-4 text-center peer-checked:border-accent-500 peer-checked:bg-accent-50 transition-all">
                                    <i class="fas fa-search text-2xl text-navy-400 peer-checked:text-accent-500 mb-2 block"></i>
                                    <span class="font-medium text-navy-700">探す</span>
                                </div>
                            </label>
                            <label class="flex-1 cursor-pointer">
                                <input type="radio" name="category" value="売る" class="sr-only peer">
                                <div class="border-2 border-navy-200 rounded-lg p-4 text-center peer-checked:border-navy-700 peer-checked:bg-navy-50 transition-all">
                                    <i class="fas fa-yen-sign text-2xl text-navy-400 peer-checked:text-navy-700 mb-2 block"></i>
                                    <span class="font-medium text-navy-700">売る</span>
                                </div>
                            </label>
                            <label class="flex-1 cursor-pointer">
                                <input type="radio" name="category" value="借りる" class="sr-only peer">
                                <div class="border-2 border-navy-200 rounded-lg p-4 text-center peer-checked:border-green-600 peer-checked:bg-green-50 transition-all">
                                    <i class="fas fa-sync-alt text-2xl text-navy-400 peer-checked:text-green-600 mb-2 block"></i>
                                    <span class="font-medium text-navy-700">借りる</span>
                                </div>
                            </label>
                        </div>
                    </div>
                    
                    <!-- 送信ボタン -->
                    <div id="submitSection" class="hidden">
                        <button type="submit" id="submitBtn"
                                class="w-full bg-accent-500 hover:bg-accent-600 text-white font-bold py-4 px-6 rounded-lg transition-colors">
                            <i class="fas fa-plus mr-2"></i>記事を追加する
                        </button>
                    </div>
                </form>
            </section>
            
            <!-- 登録済み記事一覧 -->
            <section class="bg-white rounded-xl shadow-sm p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-lg font-bold text-navy-800 flex items-center">
                        <i class="fas fa-list text-navy-600 mr-2"></i>
                        登録済み記事
                    </h2>
                    <div class="flex items-center gap-3">
                        <select id="filterCategory" class="border border-navy-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500">
                            <option value="all">すべて</option>
                            <option value="探す">探す</option>
                            <option value="売る">売る</option>
                            <option value="借りる">借りる</option>
                        </select>
                        <span id="articleCount" class="text-sm text-navy-500">0件</span>
                    </div>
                </div>
                
                <div id="articleList" class="space-y-3">
                    <!-- 記事一覧がここに表示される -->
                    <div class="text-center py-8 text-navy-400">
                        <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                        <p>読み込み中...</p>
                    </div>
                </div>
            </section>
            
        </main>
    </div>
    
    <!-- トースト通知 -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>
    
    <!-- 削除確認モーダル -->
    <div id="deleteModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl p-6 max-w-md w-full">
            <h3 class="text-lg font-bold text-navy-800 mb-4">
                <i class="fas fa-exclamation-triangle text-red-500 mr-2"></i>
                削除の確認
            </h3>
            <p class="text-navy-600 mb-6">この記事を削除してもよろしいですか？この操作は取り消せません。</p>
            <div class="flex gap-3">
                <button id="cancelDeleteBtn" class="flex-1 bg-navy-100 hover:bg-navy-200 text-navy-700 font-medium py-3 px-4 rounded-lg transition-colors">
                    キャンセル
                </button>
                <button id="confirmDeleteBtn" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-medium py-3 px-4 rounded-lg transition-colors">
                    削除する
                </button>
            </div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script>
        // 認証状態
        let adminPassword = '';
        
        // 要素取得
        const loginScreen = document.getElementById('loginScreen');
        const adminContent = document.getElementById('adminContent');
        const loginForm = document.getElementById('loginForm');
        const loginPassword = document.getElementById('loginPassword');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        
        const form = document.getElementById('addArticleForm');
        const urlInput = document.getElementById('articleUrl');
        const fetchOgpBtn = document.getElementById('fetchOgpBtn');
        const previewArea = document.getElementById('previewArea');
        const categorySection = document.getElementById('categorySection');
        const submitSection = document.getElementById('submitSection');
        const articleList = document.getElementById('articleList');
        const articleCount = document.getElementById('articleCount');
        const filterCategory = document.getElementById('filterCategory');
        const deleteModal = document.getElementById('deleteModal');
        const toastContainer = document.getElementById('toastContainer');
        
        let deleteTargetId = null;
        
        // セッションストレージから認証状態を復元
        function checkAuth() {
            const savedPassword = sessionStorage.getItem('adminPassword');
            if (savedPassword) {
                adminPassword = savedPassword;
                showAdmin();
                return true;
            }
            return false;
        }
        
        // 管理画面を表示
        function showAdmin() {
            loginScreen.classList.add('hidden');
            adminContent.classList.remove('hidden');
            loadArticles();
        }
        
        // ログイン処理
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = loginPassword.value;
            const loginBtn = document.getElementById('loginBtn');
            
            loginBtn.classList.add('btn-loading');
            loginBtn.disabled = true;
            loginError.classList.add('hidden');
            
            try {
                const res = await fetch('/api/auth/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                
                if (res.ok) {
                    adminPassword = password;
                    sessionStorage.setItem('adminPassword', password);
                    showAdmin();
                } else {
                    loginError.querySelector('span').textContent = 'パスワードが正しくありません';
                    loginError.classList.remove('hidden');
                    loginPassword.focus();
                }
            } catch (error) {
                loginError.querySelector('span').textContent = '接続エラーが発生しました';
                loginError.classList.remove('hidden');
            } finally {
                loginBtn.classList.remove('btn-loading');
                loginBtn.disabled = false;
            }
        });
        
        // ログアウト
        logoutBtn.addEventListener('click', () => {
            adminPassword = '';
            sessionStorage.removeItem('adminPassword');
            adminContent.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            loginPassword.value = '';
        });
        
        // トースト通知
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-navy-700';
            toast.className = `toast ${bgColor} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2`;
            toast.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i>
                <span>${message}</span>
            `;
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        // カテゴリラベルの色
        function getCategoryColor(category) {
            switch(category) {
                case '探す': return 'bg-accent-500';
                case '売る': return 'bg-navy-700';
                case '借りる': return 'bg-green-600';
                default: return 'bg-navy-500';
            }
        }
        
        // 日付フォーマット
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '.');
        }
        
        // 認証付きfetch
        async function authFetch(url, options = {}) {
            const headers = {
                ...options.headers,
                'X-Admin-Password': adminPassword
            };
            return fetch(url, { ...options, headers });
        }
        
        // OGP情報を取得
        fetchOgpBtn.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            if (!url) {
                showToast('URLを入力してください', 'error');
                return;
            }
            
            // URLバリデーション
            try {
                new URL(url);
            } catch {
                showToast('有効なURLを入力してください', 'error');
                return;
            }
            
            fetchOgpBtn.classList.add('btn-loading');
            fetchOgpBtn.disabled = true;
            
            try {
                const res = await authFetch('/api/ogp/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    throw new Error(data.error || 'OGP情報の取得に失敗しました');
                }
                
                // プレビューに反映
                document.getElementById('articleTitle').value = data.title || '';
                document.getElementById('articleDescription').value = data.description || '';
                document.getElementById('articleImage').value = data.image || '';
                document.getElementById('articleSource').value = data.source || '';
                
                // 画像プレビュー
                const previewImage = document.getElementById('previewImage');
                if (data.image) {
                    previewImage.innerHTML = `<img src="${data.image}" alt="" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<i class=\\'fas fa-image text-2xl text-navy-400\\'></i>'">`;
                } else {
                    previewImage.innerHTML = '<i class="fas fa-image text-2xl text-navy-400"></i>';
                }
                
                // フォーム表示
                previewArea.classList.remove('hidden');
                categorySection.classList.remove('hidden');
                submitSection.classList.remove('hidden');
                
                showToast('記事情報を取得しました', 'success');
                
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                fetchOgpBtn.classList.remove('btn-loading');
                fetchOgpBtn.disabled = false;
            }
        });
        
        // 記事追加
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.classList.add('btn-loading');
            submitBtn.disabled = true;
            
            const category = document.querySelector('input[name="category"]:checked');
            if (!category) {
                showToast('カテゴリを選択してください', 'error');
                submitBtn.classList.remove('btn-loading');
                submitBtn.disabled = false;
                return;
            }
            
            const articleData = {
                url: urlInput.value.trim(),
                title: document.getElementById('articleTitle').value.trim(),
                description: document.getElementById('articleDescription').value.trim(),
                image: document.getElementById('articleImage').value,
                source: document.getElementById('articleSource').value,
                category: category.value
            };
            
            try {
                const res = await authFetch('/api/articles', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(articleData)
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    throw new Error(data.error || '記事の追加に失敗しました');
                }
                
                showToast('記事を追加しました', 'success');
                
                // フォームリセット
                form.reset();
                previewArea.classList.add('hidden');
                categorySection.classList.add('hidden');
                submitSection.classList.add('hidden');
                document.getElementById('previewImage').innerHTML = '<i class="fas fa-image text-2xl text-navy-400"></i>';
                
                // 一覧を更新
                loadArticles();
                
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                submitBtn.classList.remove('btn-loading');
                submitBtn.disabled = false;
            }
        });
        
        // 記事一覧を読み込み
        async function loadArticles() {
            const category = filterCategory.value;
            const url = category === 'all' ? '/api/articles' : `/api/articles?category=${encodeURIComponent(category)}`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                
                articleCount.textContent = `${data.articles.length}件`;
                
                if (data.articles.length === 0) {
                    articleList.innerHTML = `
                        <div class="text-center py-12 text-navy-400">
                            <i class="fas fa-inbox text-4xl mb-3"></i>
                            <p>記事がまだありません</p>
                        </div>
                    `;
                    return;
                }
                
                articleList.innerHTML = data.articles.map(article => {
                    const categoryColor = getCategoryColor(article.category);
                    const imageHtml = article.image 
                        ? `<img src="${article.image}" alt="" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<i class=\\'fas fa-newspaper text-xl text-navy-400\\'></i>'">`
                        : `<i class="fas fa-newspaper text-xl text-navy-400"></i>`;
                    
                    return `
                        <div class="card-hover flex items-center gap-4 border border-navy-100 rounded-lg p-4 bg-white">
                            <div class="flex-shrink-0 w-20 h-16 img-placeholder rounded flex items-center justify-center overflow-hidden">
                                ${imageHtml}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="${categoryColor} text-white text-xs font-medium px-2 py-0.5 rounded">${article.category}</span>
                                    <span class="text-navy-400 text-xs">${article.source}</span>
                                    <span class="text-navy-300 text-xs">${formatDate(article.addedDate)}</span>
                                </div>
                                <h3 class="font-medium text-navy-800 text-sm line-clamp-1">${article.title}</h3>
                                <p class="text-navy-500 text-xs line-clamp-1">${article.url}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-navy-400 text-xs">
                                    <i class="far fa-eye mr-1"></i>${article.views}
                                </span>
                                <a href="${article.url}" target="_blank" rel="noopener" 
                                   class="p-2 text-navy-400 hover:text-accent-500 transition-colors">
                                    <i class="fas fa-external-link-alt"></i>
                                </a>
                                <button onclick="openDeleteModal('${article.id}')" 
                                        class="p-2 text-navy-400 hover:text-red-500 transition-colors">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                articleList.innerHTML = `
                    <div class="text-center py-12 text-red-500">
                        <i class="fas fa-exclamation-circle text-4xl mb-3"></i>
                        <p>読み込みに失敗しました</p>
                    </div>
                `;
            }
        }
        
        // フィルター変更時
        filterCategory.addEventListener('change', loadArticles);
        
        // 削除モーダル
        function openDeleteModal(id) {
            deleteTargetId = id;
            deleteModal.classList.remove('hidden');
        }
        
        document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
            deleteModal.classList.add('hidden');
            deleteTargetId = null;
        });
        
        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (!deleteTargetId) return;
            
            try {
                const res = await authFetch(`/api/articles/${deleteTargetId}`, {
                    method: 'DELETE'
                });
                
                if (!res.ok) {
                    throw new Error('削除に失敗しました');
                }
                
                showToast('記事を削除しました', 'success');
                loadArticles();
                
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                deleteModal.classList.add('hidden');
                deleteTargetId = null;
            }
        });
        
        // モーダル外クリックで閉じる
        deleteModal.addEventListener('click', (e) => {
            if (e.target === deleteModal) {
                deleteModal.classList.add('hidden');
                deleteTargetId = null;
            }
        });
        
        // 初期化
        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAuth()) {
                // 未認証の場合はログイン画面を表示
                loginScreen.classList.remove('hidden');
            }
        });
    </script>
    
</body>
</html>
